name: Build BizOne ERP (Windows .exe, Android .apk & macOS .app)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 1. Biên dịch ứng dụng Android (.apk)
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Scaffold Android Runner
        run: flutter create --platforms=android --org=com.bizone.fad .

      - name: Install dependencies
        run: flutter pub get

      - name: Run Unit Tests
        run: flutter test

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BizOne_FAD_Android_v1.0.apk
          path: build/app/outputs/flutter-apk/app-release.apk

  # 2. Biên dịch ứng dụng PC Windows (.exe)
  build-windows:
    name: Build Windows PC (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Scaffold Windows Runner
        run: flutter create --platforms=windows --org=com.bizone.fad .

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows Executable (.exe)
        run: flutter build windows --release

      - name: Package Windows Release as Zip
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath BizOne_FAD_Windows_x64.zip

      - name: Upload Windows EXE Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BizOne_FAD_Windows_x64.zip
          path: BizOne_FAD_Windows_x64.zip

  # 3. Biên dịch ứng dụng macOS (.app / .zip)
  build-macos:
    name: Build macOS Desktop (.app)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Enable macOS Desktop
        run: flutter config --enable-macos-desktop

      - name: Scaffold macOS Runner
        run: flutter create --platforms=macos --org=com.bizone.fad .

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS App (.app)
        run: flutter build macos --release

      - name: Package macOS Release as Zip
        run: |
          ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/bizone_fad.app BizOne_FAD_macOS.zip

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BizOne_FAD_macOS.zip
          path: BizOne_FAD_macOS.zip
